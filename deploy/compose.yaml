# Базовый compose-файл dev-стенда (TZ §14.2, docs/tz/02 §2.1).
#
# Принципы, которые здесь закреплены:
#   * PostgreSQL не имеет исходящего трафика вообще: сеть `tbot-backend` помечена internal,
#     порты наружу не публикуются (приёмка T-005: «egress для БД закрыт»);
#   * секреты монтируются только в те контейнеры, которым они нужны, только read-only;
#   * процессы работают от непривилегированного пользователя, без новых привилегий,
#     с ограничением CPU/памяти (площадка 2 vCPU / 3.8 GiB — OQ-11);
#   * у каждого процесса есть healthcheck, поэтому `depends_on` опирается на готовность,
#     а не на «поспать десять секунд».
#
# Локальные отличия (публикация портов, каталоги dev-секретов и **сборка образов**) —
# в compose.override.yaml. `build` здесь не объявлен намеренно: боевой контур собирается
# командами `.github/workflows/image.yml` и запускается парой `compose.yaml +
# compose.prod.yaml`, где `build` не встречается ни в одном файле. Причина найдена
# первым прогоном job'а `prod-config`: `build: !reset null` в overlay НЕ убирает сборку из
# разобранной модели compose (в `config --format json` остаются `context` и `dockerfile`),
# а пока `build` в модели есть, `up -d` с отсутствующим локально образом соберёт его прямо
# на площадке. Держит это `no_local_build` в `scripts/prod_compose_check.py` и
# `test_локальная_сборка_объявлена_только_в_dev_дополнении`.

name: tbot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime: &default-runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging: *default-logging

x-db-runtime: &db-runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Единственное точечное исключение в стенде — и только для базы.
  # Entrypoint официального образа postgres (/usr/local/bin/docker-entrypoint.sh) работает под
  # root и рассчитывает на дефолтный набор capability Docker'а. Из него нужны ровно пять:
  #   * DAC_OVERRIDE — вход в каталог данных: entrypoint сначала делает `chmod 00700 $PGDATA`,
  #     а владельцем том `pgdata` приходит из образа (uid 999), и без DAC_OVERRIDE следующий
  #     `find "$PGDATA" \! -user postgres -exec chown postgres` падает с «Permission denied»
  #     (ровно это и было в прогоне CI от 2026-11-20);
  #   * FOWNER — `chmod` каталога данных (владелец — не root) и `chmod 03775 /var/run/postgresql`;
  #   * CHOWN — `chown postgres` каталога данных и каталога unix-сокета;
  #   * SETGID, SETUID — `gosu postgres` делает setgroups/setgid/setuid и только после этого
  #     exec'ит сервер; без них контейнер падает на `failed switching to "postgres"`.
  # Границы исключения: `no-new-privileges` сохранён (gosu — не setuid-бинарник, привилегии он
  # получает системными вызовами, а сервер `postgres` после переключения пользователя работает
  # вообще без capability); исходящего трафика у базы по-прежнему нет (сеть `internal`, порты
  # наружу не публикуются). Остальной дефолтный набор сброшен: entrypoint и сервер не
  # используют NET_RAW, NET_ADMIN, SYS_CHROOT, MKNOD, KILL, SETPCAP, SETFCAP, NET_BIND_SERVICE
  # (порт 5432 выше привилегированного диапазона) и AUDIT_WRITE. FSETID намеренно не просим:
  # у /var/run/postgresql просто не проставятся спецбиты из `chmod 03775`, на работу это не
  # влияет — каталог принадлежит пользователю postgres. Минимальность набора закреплена
  # контрактом `test_база_получает_только_те_capability_которые_нужны_entrypoint`.
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  pids_limit: 256
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    # Каталог unix-сокета: на read-only корневой ФС postgres не может ни создать этот
    # каталог, ни записать в него файл сокета — поэтому он вынесен на отдельный tmpfs.
    - /var/run/postgresql:size=16m,mode=1777
  logging: *default-logging

x-app-env: &app-env
  TBOT_SECRETS_DIR: /run/secrets
  TBOT_LOG_JSON: "true"

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: tbot
      POSTGRES_USER: tbot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Время в базе — UTC: прикладной слой работает в UTC (TZ §2.7)
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/tbot.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Относительный путь монтирования разрешается относительно каталога compose-файла
      # (deploy/), а не репозитория: `./deploy/postgres/...` дал бы deploy/deploy/postgres/...,
      # несуществующий путь в короткой форме Docker заменяет на пустой каталог, и postgres
      # падал бы с бессмысленным «input in flex scanner failed at ... line 1».
      - ./postgres/tbot.conf:/etc/postgresql/tbot.conf:ro
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot -d tbot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tbot-backend
    <<: *db-runtime

  web:
    image: tbot-web:dev
    environment:
      <<: *app-env
      TBOT_WEB_HOST: 0.0.0.0
      # Путь файла ключей KEK внутри контейнера. Здесь только путь: значение даёт compose, который
      # монтирует секрет `kek_file` в `/run/secrets/kek_file` (§8.4 «KEK не в БД и не в образе»,
      # `ADR-014` п. 5). `Settings.kek_file` по умолчанию указывает на хозяйский путь, поэтому
      # переменная обязана быть: без неё процесс в контейнере искал бы `/etc/tbot/keys/kek.json`
      # внутри своей read-only корневой ФС и падал бы с «нет файла ключей».
      TBOT_KEK_FILE: /run/secrets/kek_file
    # Секреты монтируются только туда, где их читают: web ходит в базу, но не знает токен бота.
    # Файл ключей — тоже только web'у: привязку TOTP делает панель (`R4c`), а `engine`, `jobs` и
    # `migrate` ключевой материал не читают вовсе (§8.4: доступ минимальный, лишний процесс с KEK
    # — лишний путь утечки в лог или дамп).
    secrets:
      - db_url
      - kek_file
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbot-edge
      - tbot-backend
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - packages.common.health_probe
        - --url
        - http://127.0.0.1:8080/readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-runtime

  engine:
    image: tbot-engine:dev
    environment:
      <<: *app-env
    secrets:
      - db_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbot-backend
      - tbot-egress
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - packages.common.health_probe
        - --url
        - http://127.0.0.1:9101/readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-runtime

  tgbot:
    image: tbot-tgbot:dev
    environment:
      <<: *app-env
      # Туннель-клиент живёт на хосте площадки (tbot-tunnel.service), поэтому из контейнера
      # SOCKS-адрес — шлюз docker, а не 127.0.0.1 контейнера (docs/runbook/telegram-egress-proxy.md).
      TBOT_TELEGRAM__SOCKS_HOST: host.docker.internal
    secrets:
      - tg_bot_token
      - tg_socks_password
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - tbot-backend
      - tbot-egress
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - packages.common.health_probe
        - --url
        - http://127.0.0.1:9102/readyz
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    <<: *default-runtime

  jobs:
    image: tbot-jobs:dev
    environment:
      <<: *app-env
    secrets:
      - db_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbot-backend
    healthcheck:
      # Liveness, а не readiness: на M0 у `jobs` нет ни одного исполнителя задач, и `executors_check`
      # честно отвечает «не готово» (это охрана от того, чтобы `/readyz` врал о готовности).
      # Готовность задач проверяется отдельно — шагами CI и `/readyz` после появления исполнителей
      # (M2 и далее, см. docs/tz/12 §12.3).
      test:
        - CMD
        - python
        - -m
        - packages.common.health_probe
        - --liveness
        - --url
        - http://127.0.0.1:9103/healthz
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-runtime

  migrate:
    image: tbot-web:dev
    profiles: ["tools"]
    environment:
      <<: *app-env
      # Роль-мигратор (`ADR-018`): Alembic делает DDL, а DDL по объекту чужой роли запрещён.
      # Замер на площадке 2026-11-22: ревизия `0003` под ролью приложения даёт
      # `42501 must be owner of table sessions`, потому что таблицы `0001`/`0002` принадлежат
      # роли-владельцу схемы. Имя роли — не секрет: пароль остаётся тем же значением в том же
      # файле `db_url`, второго DSN-секрета (`db_url_owner`) не появляется — от него отказался
      # заказчик в `ADR-006` (вариант А).
      #
      # Переменная объявлена ТОЛЬКО у `migrate`. У `web`, `engine`, `jobs` и `tgbot` её нет, и
      # их `Settings.migration_db_user` остаётся `None`: ограниченный рантайм-процесс не должен
      # сам выбирать себе роль-владельца. Держит проверка
      # `test_роль_мигратора_выделена_только_процессу_миграций`.
      TBOT_MIGRATION_DB_USER: tbot
    secrets:
      - db_url
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbot-backend
    <<: *default-runtime

networks:
  tbot-backend:
    internal: true
  tbot-edge:
    internal: true
  tbot-egress:
    # Единственная сеть с выходом наружу: брокер и туннель. БД в неё не подключена.
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password
  db_url:
    file: ./secrets/db_url
  tg_bot_token:
    file: ./secrets/tg_bot_token
  tg_socks_password:
    file: ./secrets/tg_socks_password
  # Файл ключей KEK (`ADR-014` п. 5). В боевом составе путь другой — TZ §8.4 называет
  # `/etc/tbot/keys/kek.json`, и задаёт его `compose.prod.yaml` (см. комментарий там же: это
  # осознанное исключение из «все секреты в /etc/tbot/secrets»). Здесь dev-копия того же файла,
  # созданная тем же инструментом, что и на площадке:
  #   python3 deploy/vps/keys_setup.py --path deploy/secrets/kek.json --expect-owner any
  kek_file:
    file: ./secrets/kek.json

volumes:
  pgdata:
