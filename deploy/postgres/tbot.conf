# Параметры PostgreSQL для стенда и площадки (TZ §14.2, OQ-11).
#
# Площадка 2 vCPU / 3.8 GiB RAM: shared_buffers не выше 512 MiB, max_connections не выше 60.
# Для тестового стенда 192.168.1.40 (2.9 GiB RAM) значения ниже — они и стоят здесь как база;
# для прод-площадки допускается повышение через отдельный файл override (см. deploy/README.md).

# Интерфейсы прослушивания. Внутри контейнера базы `*` — обязателен: приложение ходит
# в базу по TCP через сеть `tbot-backend`, а `localhost` означал бы только loopback
# контейнера и соединения из web/engine/jobs падали бы с «connection refused».
# Наружу этот порт не смотрит: база подключена только к `internal`-сети, порты
# публикуются лишь в dev-дополнении и только на 127.0.0.1 (приёмка T-005 «egress для БД
# закрыт» проверяется отдельным шагом CI).
listen_addresses = '*'
port = 5432

# --- память (ограничение OQ-11) ---
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 128MB
work_mem = 4MB
huge_pages = off

# --- соединения: приложение ходит пулом, больших значений быть не должно ---
max_connections = 60
superuser_reserved_connections = 3
idle_in_transaction_session_timeout = 60s
lock_timeout = 5s
statement_timeout = 120s

# --- время и журналирование ---
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '

# --- надёжность и объём (72 ГБ на текущей площадке) ---
wal_compression = on
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
archive_mode = off

# --- планировщик под рабочую нагрузку (поток данных, а не ad-hoc аналитика) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
