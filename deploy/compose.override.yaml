# Локальные дополнения к compose (dev). Базовые гарантии безопасности — в compose.yaml,
# здесь только удобство разработки: публикация портов на loopback и dev-секреты из ./secrets.
#
# Каталог секретов создаётся вручную (он в .gitignore — `deploy/secrets/`; compose разрешает
# `./secrets/...` относительно deploy/compose.yaml):
#   mkdir -p deploy/secrets && printf 'dev-db-password' > deploy/secrets/db_password
#   printf 'postgresql://tbot:dev-db-password@postgres:5432/tbot' > deploy/secrets/db_url
#   printf 'dev-only-token-not-secret' > deploy/secrets/tg_bot_token
#   printf 'dev-only-socks-password' > deploy/secrets/tg_socks_password
# Файл ключей `kek.json` — не строка, а JSON с версиями ключей, поэтому его создаёт тот же
# инструмент, что и на площадке, а не `printf`:
#   python3 deploy/vps/keys_setup.py --path deploy/secrets/kek.json --expect-owner any
# (прогон без root: на dev-машине владельца `0:10001` поставить нечем).
# Значения боевого контура сюда не попадают никогда.

services:
  # Сборка — только здесь (её нет в базовом файле): боевой состав (`compose.yaml` +
  # `compose.prod.yaml`) обязан не содержать пути к локальной сборке вообще, потому что
  # `up -d` с `build` в разобранной модели собирает образ на площадке вместо pull по digest.
  # Те же четыре образа в бою собираются шагами `.github/workflows/image.yml`.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: web
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG

  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: engine
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG

  tgbot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: tgbot
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG
      # В dev-стенде Telegram-канал заведомо недоступен: чтобы readiness не «красил» весь
      # стенд, проверка транспорта остаётся, но деградация отображается отдельным полем.
      TBOT_INSTANCE_NAME: dev-stand

  jobs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: jobs
    environment:
      TBOT_LOG_JSON: "false"

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: web
