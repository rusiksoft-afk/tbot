# Локальные дополнения к compose (dev). Базовые гарантии безопасности — в compose.yaml,
# здесь только удобство разработки: публикация портов на loopback и dev-секреты из ./secrets.
#
# Каталог секретов создаётся вручную (он в .gitignore — `deploy/secrets/`; compose разрешает
# `./secrets/...` относительно deploy/compose.yaml):
#   mkdir -p deploy/secrets && printf 'dev-db-password' > deploy/secrets/db_password
#   printf 'postgresql://tbot:dev-db-password@postgres:5432/tbot' > deploy/secrets/db_url
#   printf 'dev-only-token-not-secret' > deploy/secrets/tg_bot_token
#   printf 'dev-only-socks-password' > deploy/secrets/tg_socks_password
# Значения боевого контура сюда не попадают никогда.

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  web:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG

  engine:
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG

  tgbot:
    environment:
      TBOT_LOG_JSON: "false"
      TBOT_LOG_LEVEL: DEBUG
      # В dev-стенде Telegram-канал заведомо недоступен: чтобы readiness не «красил» весь
      # стенд, проверка транспорта остаётся, но деградация отображается отдельным полем.
      TBOT_INSTANCE_NAME: dev-stand

  jobs:
    environment:
      TBOT_LOG_JSON: "false"
