# Боевой compose-состав (TZ §14.2, §14.6; задачи T-712 и T-713).
#
# Это **overlay** над deploy/compose.yaml: hardening, сети, healthcheck'и и секреты по имени
# общие, а сюда входит то, что отличает боевой запуск от dev-стенда и CI:
#
#   1) образы берутся из GHCR **по digest** (`docs/runbook/ghcr-pull.md §1`: тег `main` —
#      перемещаемая метка, откат по тегу невоспроизводим), а локальной сборки в боевом разборе
#      нет вовсе: `build` объявлен только в `compose.override.yaml` (dev), который в бою не
#      подключается. Причина найдена первым прогоном job'а `prod-config` (2026-11-20):
#      `build: !reset null` в overlay НЕ убирает сборку из разобранной модели compose —
#      в `config --format json` остаются `context` (каталог проекта) и `dockerfile` из базового
#      файла. Пока `build` в модели есть, `up -d` с отсутствующим локально образом соберёт его
#      прямо на площадке, и связь «запустили ровно то, что собрали в CI» потеряется;
#      проверка `no_local_build` в `scripts/prod_compose_check.py` это и держит;
#   2) наружу публикуется **только** 80/443 Caddy. У базы и внутренних сервисов портов нет:
#      опубликованный Docker-портом порт доступен снаружи независимо от ufw (правила уходят в
#      FORWARD/nat), поэтому «какой порт наружу» решается здесь, а не файрволом
#      (`docs/acceptance/prod-firewall.md §5`);
#   3) секреты читаются файлами из `/etc/tbot/secrets` (TZ §14.3), не из переменных окружения;
#   4) лимиты памяти/CPU проставлены под фактическую площадку (2 vCPU / 3.8 ГиБ, OQ-11).
#
# Проверка и запуск (каталог репозитория на площадке — /opt/tbot):
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file tbot.prod.env config
#   docker compose ... up -d postgres && ... run --rm migrate alembic upgrade head && ... up -d
# Разбор состава проверяется не только руками: job `prod-config` в `.github/workflows/ci.yml`
# исполняет `config` на CI-раннёре (Docker на dev-машине нет) и дополнительно прогоняет
# `caddy validate` внутри того самого образа, digest которого зафиксирован в `tbot.prod.env`.
# Статическая половина — контрактный тест `tests/integration/test_compose_prod_contract.py`.

name: tbot

# Единый якорь для всех прикладных процессов: боевой restart и потолок по умолчанию.
# Повторить `<<:` дважды в одном отображении YAML не позволяет, поэтому
# всё, что общее, лежит здесь.
#
# `environment` здесь дополняет (а не заменяет) базовый якорь `x-app-env`: слияние compose идёт
# по ключам. Контур обязан быть явным: по умолчанию `Settings.contour = sandbox`, и боевой
# процесс с `TBOT_CONTOUR=production` не стартует без `TBOT_CONFIRM_PRODUCTION=true` (TZ §2.4,
# `packages/common/config.py`). Оба значения — не секреты, но и не решение прошлого: значение
# по умолчанию здесь — прежнее (sandbox/false), а включение боя даёт оператор при деплое.
x-prod-app: &prod-app
  restart: always
  mem_limit: 384m
  cpus: 0.5
  environment:
    TBOT_CONTOUR: ${TBOT_CONTOUR:-sandbox}
    TBOT_CONFIRM_PRODUCTION: ${TBOT_CONFIRM_PRODUCTION:-false}

services:
  postgres:
    restart: always
    # Образ базы тоже по digest (TZ §14.6, `docs/runbook/ghcr-pull.md §2`): база не из GHCR, но
    # CI-стенд и площадка обязаны получать один и тот же образ, иначе «учение на площадке»
    # проверяет не ту версию Postgres, что в CI. Без этой строки базовый `image: postgres:16.4`
    # (тег = перемещаемая метка) остался бы единственной незафиксированной частью состава.
    image: postgres@${TBOT_POSTGRES_DIGEST}
    # 768 МиБ при shared_buffers 256 МБ (deploy/postgres/tbot.conf): запас на work_mem ×
    # число соединений и кэш ОС. Без потолка OOM-killer выбирает самое крупное — то есть базу.
    # Потолок ниже значения TZ §14.6 (3 GiB) из-за OQ-11: «без расширения», 3.8 ГиБ на всех.
    mem_limit: 768m
    cpus: 1.5

  web:
    <<: *prod-app
    image: ghcr.io/rusiksoft-afk/tbot-web@${TBOT_WEB_DIGEST}
    mem_limit: 320m
    # Панель отвечает за людей: 0.5 vCPU хватает, потому что тяжёлые вычисления делают engine
    # и jobs, а не web.
    cpus: 0.5
    # Списки `networks` в overlay сливаются с базовыми по имени сети, а не заменяют их:
    # здесь web остаётся и на базовой `tbot-edge`. Это намеренно оставлено как есть:
    # `tbot-edge` в базовом файле — `internal: true`, то есть она не даёт никакого пути
    # наружу; доступ к панели извне идёт только через `tbot-public` (см. ниже), а доступ
    # web к базе — через `tbot-backend`. Контракт на «у каких сервисов есть egress» —
    # `test_egress_получают_только_разрешённые_сервисы` + шаг CI с реальным разбором compose.
    networks:
      - tbot-backend
      - tbot-public

  engine:
    <<: *prod-app
    image: ghcr.io/rusiksoft-afk/tbot-engine@${TBOT_ENGINE_DIGEST}
    mem_limit: 896m
    cpus: 1.0
    # SIGTERM + 60 секунд (TZ §14.6): ядро обязано успеть отписаться от потока брокера и
    # записать состояние, иначе после рестарта сверка позиций идёт «с нуля» (TZ §7.6).
    stop_grace_period: 60s

  tgbot:
    <<: *prod-app
    image: ghcr.io/rusiksoft-afk/tbot-tgbot@${TBOT_TGBOT_DIGEST}
    mem_limit: 256m
    cpus: 0.25

  jobs:
    <<: *prod-app
    image: ghcr.io/rusiksoft-afk/tbot-jobs@${TBOT_JOBS_DIGEST}
    mem_limit: 512m
    cpus: 0.5

  migrate:
    # Одноразовый процесс: restart ему не нужен (profile tools уже в базовом файле),
    # а сборки здесь нет по той же причине, что и у остальных: dev-сборки объявлены только
    # в `compose.override.yaml`.
    image: ghcr.io/rusiksoft-afk/tbot-web@${TBOT_WEB_DIGEST}
    mem_limit: 320m

  # Единственный слушатель наружу (T-713, TZ §8.3): сертификат Let's Encrypt, редирект
  # HTTP→HTTPS, HSTS и базовые охранные заголовки, прокси на web.
  caddy:
    image: caddy@${CADDY_DIGEST}
    # Лимиты — ровно из TZ §14.6 («caddy restart always; limits 128M CPU 0.25»).
    restart: always
    mem_limit: 128m
    cpus: 0.25
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 отдельной строкой: `443:443` публикует только tcp. Caddyfile объявляет
      # `protocols h1 h2 h3` и отдаёт `Alt-Svc: h3=":443"`, а файрвол и группа безопасности
      # пропускают 443/udp (TZ §8.5, ADR-003) — но без этой строки Docker не поднимает UDP-публикацию,
      # и браузер, поверивший Alt-Svc, уходит в QUIC, которого нет (замер 2026-11-20 на площадке:
      # Alt-Svc есть, а на UDP/443 приходит ICMP port unreachable).
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME-аккаунт, выпуск сертификата и рабочий каталог Caddy переживают пересоздание
      # контейнера: иначе каждый деплой запрашивал бы сертификат заново и упёрся бы в лимит
      # Let's Encrypt (50 сертификатов в неделю на домен).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tbot-public
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Валидация конфигурации, а не HTTP-запрос к себе: запрос к собственному сайту связал бы
      # готовность прокси с выпуском сертификата и состоянием web.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Тот же набор, что у всех процессов стенда (базовый x-runtime сюда не наследуется: сервис
    # в overlay новый).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Точечное исключение: официальный образ Caddy работает от root и слушает 80/443, а без
    # NET_BIND_SERVICE привилегированный диапазон недоступен. Это отклонение от абзаца
    # TZ §8.5 «не-root пользователь в контейнерах» — осознанное: перевести официальный образ на
    # непривилегированного пользователя нельзя без доработки entrypoint (именованные тома
    # /data и /config создаются root-владельцами, а пересборка образа с плагином означала бы
    # отказ от публичного digest). Остальная охрана при этом сохранена: cap_drop ALL,
    # no-new-privileges, read-only rootfs, pids_limit. Минимальность исключения держит контракт
    # `test_caddy_получает_ровно_net_bind_service` — набор не имеет права расти.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

networks:
  tbot-public:
    # Сеть с доступом наружу (не internal) ровно для двух участников — Caddy и web: в неё не
    # подключены база, engine, jobs и tgbot, поэтому опубликованный 443 не даёт доступа к ним.
    # Почему web обязан быть в сети с egress: Caddy ходит к нему как к upstream по имени сервиса,
    # а сам прокси обязан иметь исходящие — ACME выпускает сертификат не только входящим
    # HTTP-01 вызовом, но и обращениями к каталогу ACME (см. `deploy/caddy/Caddyfile`).
    # Последствие для TZ §8.5: у web появляется исходящий трафик, которого в dev-стенде нет;
    # политика «какие адреса разрешены» держится цепочкой `DOCKER-USER` на хосте
    # (`docs/acceptance/prod-firewall.md §5`, `deploy/vps/README.md`), а не этим файлом.
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

secrets:
  # Пути задаются здесь: в dev-стенде секреты лежат в deploy/secrets/, на площадке — в
  # /etc/tbot/secrets файлами с правами 600 (TZ §14.3). Имена файлов совпадают с тем, что уже
  # лежит на площадке и с runbook'ами (telegram_token — docs/runbook/telegram-token.md,
  # telegram_socks_pass — docs/runbook/telegram-egress-proxy.md).
  db_password:
    file: /etc/tbot/secrets/db_password
  db_url:
    file: /etc/tbot/secrets/db_url
  tg_bot_token:
    file: /etc/tbot/secrets/telegram_token
  tg_socks_password:
    file: /etc/tbot/secrets/telegram_socks_pass
