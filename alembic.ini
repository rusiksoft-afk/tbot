# Конфигурация Alembic. Строка подключения берётся из конфигурации приложения
# (TBOT_DB_URL или файл секрета db_url), чтобы миграции не могли «случайно» уйти в чужую базу.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url намеренно не задан: env.py читает его из конфигурации и отказывается работать
# без явного указания.
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff format

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
