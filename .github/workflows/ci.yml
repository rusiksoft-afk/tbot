name: CI

# Конвейер повторяет набор команд TZ §4: те же шаги исполняются локально (`make ci-local`).
# Пороги и правила зафиксированы в pyproject.toml; их изменение — отдельное согласованное
# решение, которое видно в диффе (см. также `suppress-growth` ниже).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Порог подавления проверок (см. job quality / suppress-growth). Обновляется только вместе
  # с объяснением в описании PR. Текущий уровень = 14, инвентаризация — docs/acceptance/m0-quality.md:
  #   2 × `noqa: ARG003` — состав аргументов `settings_customise_sources` задаёт pydantic-settings,
  #       переименование сломает вызов библиотеки (аргументы передаются по именам);
  #   8 × `pragma: no cover` — процессная обвязка четырёх процессов (`run()` и `__main__`):
  #       сигналы, цикл heartbeat, запуск uvicorn. Она проверяется не юнит-тестом с подменой
  #       сигналов, а job'ом `compose-smoke` (реальный `docker compose up --wait` + опрос
  #       /healthz и /readyz). Логика внутри этих модулей (проверки готовности, охрана контуров,
  #       проба транспорта) покрыта тестами и в исключение не входит.
  #   4 × `nosec` в `scripts/{dev,deploy_check}.py` — bandit ругается на сам факт использования
  #       `subprocess` в dev/ops-скриптах: вызовы идут со `shell=False` и фиксированным списком
  #       аргументов; замечание B607 (частичный путь исполняемого файла) не подавлялось, а
  #       исправлено — путь берётся из `shutil.which`.
  SUPPRESSION_BASELINE: "14"

jobs:
  quality:
    name: lint + typecheck + guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: mypy --strict
        run: mypy .
      - name: bandit
        run: bandit -c pyproject.toml -r apps packages scripts
      - name: suppress-growth
        run: |
          count=$(python scripts/count_suppressions.py)
          echo "подавлений проверок: ${count} (базовый уровень ${SUPPRESSION_BASELINE})"
          if [ "${count}" -gt "${SUPPRESSION_BASELINE}" ]; then
            echo "рост числа подавлений недопустим без явного решения заказчика"
            python scripts/count_suppressions.py --list
            exit 1
          fi

  tests:
    name: тесты и покрытие
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: pytest (без live_api и e2e)
        run: python -m pytest -m "not live_api and not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  migrations:
    name: миграции (upgrade → downgrade → upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: tbot
          POSTGRES_USER: tbot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TBOT_DB_URL: postgresql://tbot:ci-only-password@localhost:5432/tbot
      TBOT_SECRETS_DIR: /tmp/tbot-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: mkdir -p /tmp/tbot-secrets
      - name: upgrade head
        run: alembic upgrade head
      - name: downgrade base
        run: alembic downgrade base
      - name: upgrade head повторно
        run: alembic upgrade head
      - name: контрольная запись базовой ревизии
        run: |
          psql "postgresql://tbot:ci-only-password@localhost:5432/tbot" -Atc \
            "select value from app_meta where key='schema_baseline'" | grep -qx 0001

  secret-scan:
    name: поиск секретов (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  audit:
    name: зависимости (pip-audit) и статический аудит
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # Аудит ровно продакшн-зависимостей: отдельное окружение, в котором ставится только
      # пакет приложения (без dev-зависимостей), и список зависимостей без самого пакета —
      # иначе pip-audit ищет в PyPI наш `tbot (0.0.0)` и падает с `--strict`.
      - run: python -m venv .venv-audit
      - run: .venv-audit/bin/pip install -e .
      - name: список продакшн-зависимостей
        run: |
          .venv-audit/bin/pip freeze --exclude-editable > deps-audit.txt
          echo "аудит по списку ($(wc -l < deps-audit.txt) пакетов):"; cat deps-audit.txt
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r deps-audit.txt

  compose-smoke:
    name: 'dev-стенд: сборка, готовность, изоляция базы'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dev-секреты стенда (не боевые)
        # Пути секретов в compose.yaml разрешаются относительно deploy/compose.yaml,
        # поэтому каталог — deploy/secrets, а не корень репозитория.
        run: |
          mkdir -p deploy/secrets
          printf 'ci-stand-db-password' > deploy/secrets/db_password
          printf 'postgresql://tbot:ci-stand-db-password@postgres:5432/tbot' > deploy/secrets/db_url
          printf 'ci-stand-not-a-real-token' > deploy/secrets/tg_bot_token
          printf 'ci-stand-not-a-real-password' > deploy/secrets/tg_socks_password
      - name: docker compose config
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml config --quiet
      - name: собрать образы
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml build
      - name: поднять стенд
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait --wait-timeout 180 \
            postgres web engine jobs
      - name: миграции на стенде
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            run --rm migrate
      - name: web готов
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T web python -m packages.common.health_probe --url http://127.0.0.1:8080/readyz
      - name: engine и jobs живы
        run: |
          # Приёмка T-005 требует «/readyz 200 у web и engine», поэтому у engine проверяются
          # обе ручки: liveness (процесс жив) и readiness (контур + конфигурация). Разница
          # осмысленна: /readyz у engine на M0 может быть 503 при неверном контуре, тогда как
          # /healthz остаётся 200.
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python -m packages.common.health_probe --url http://127.0.0.1:9101/readyz
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python -m packages.common.health_probe --liveness --url http://127.0.0.1:9101/healthz
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T jobs python -m packages.common.health_probe --liveness --url http://127.0.0.1:9103/healthz
      - name: корень НУЦ установлен в системный набор доверия образа
        run: |
          # Половинка AC-broker-gateway-02 «с установленным корнем соединение обязано состояться»,
          # проверенная в самом образе: файл кладёт deploy/Dockerfile, а связку пересобирает
          # update-ca-certificates внутри образа. Отпечаток передаётся из scripts/ca_policy.py —
          # единственного места, где он закреплён; путь внутри образа здесь не повторяется: файл
          # ищется среди якорей, которые образ реально показал.
          set -euo pipefail
          expected=$(python3 scripts/ca_policy.py --print-fingerprint)
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python - "$expected" <<'PY'
          import base64, hashlib, pathlib, re, socket, ssl, sys

          wanted = sys.argv[1]
          anchors = pathlib.Path("/usr/local/share/ca-certificates")
          bundle = pathlib.Path("/etc/ssl/certs/ca-certificates.crt")
          hosts = ("invest-public-api.tbank.ru", "sandbox-invest-public-api.tbank.ru")

          def blocks(text: str) -> list[str]:
              return re.findall(
                  r"-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----", text, re.S
              )

          def fingerprints(path: pathlib.Path) -> dict[str, str]:
              result: dict[str, str] = {}
              for block in blocks(path.read_text(encoding="utf-8", errors="replace")):
                  result[hashlib.sha256(base64.b64decode("".join(block.split()))).hexdigest()] = str(path)
              return result

          copied: dict[str, str] = {}
          for item in sorted(p for p in anchors.rglob("*") if p.is_file()):
              copied.update(fingerprints(item))
          if wanted not in copied:
              raise SystemExit(
                  f"корень НУЦ не скопирован в {anchors}: найдено {sorted(set(copied.values()))}"
              )

          store = set(fingerprints(bundle))
          if wanted not in store:
              raise SystemExit(
                  f"{copied[wanted]} в образе есть, но в {bundle} его нет: Debian читает только "
                  f"*.crt верхнего уровня {anchors} — проверьте расширение и каталог"
              )

          for host in hosts:
              context = ssl.create_default_context()
              with socket.create_connection((host, 443), timeout=20) as sock, \
                      context.wrap_socket(sock, server_hostname=host) as tls:
                  print(f"OK {host}: цепочка доверена набору образа ({tls.version()})")
          print(f"OK: корень {wanted[:16]}… из {copied[wanted]} входит в {bundle} ({len(store)} якорей)")
          PY
      - name: у контейнера базы нет исходящего трафика
        # В образе postgres нет python3 (debian-slim + postgresql без recommends), поэтому
        # проба — на bash: /dev/tcp — встроенная возможность bash, а `timeout` — coreutils.
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T postgres bash -s <<'SH'
          set -u
          if timeout 6 bash -c 'exec 3<>/dev/tcp/8.8.8.8/443' 2>/dev/null; then
            echo "FAIL: у базы появилось исходящее соединение" >&2
            exit 1
          fi
          echo "OK: исходящий трафик базы заблокирован (внутренняя сеть)"
          SH
      - name: журнал контейнеров при неудаче
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml logs --tail=200

  prod-config:
    name: 'боевой состав: compose-overlay, digest, Caddyfile'
    # Боевой состав нигде не поднимается (ни локально, ни в compose-smoke), поэтому хотя бы
    # разбирается здесь: `docker compose config` знает настоящие правила слияния overlay, а
    # `caddy validate` внутри образа с закреплённым digest проверяет Caddyfile, не трогая
    # площадку. Статическая половина контракта — tests/integration/test_compose_prod_contract.py.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 'файлы секретов площадки (пустышки: проверяется путь, а не значение)'
        # compose при разборе состава требует, чтобы файлы секретов существовали; имена ниже —
        # те же, что кладёт заказчик (TZ §14.3, docs/runbook/telegram-token.md). Без этого шага
        # разбор падал бы на отсутствующем файле, а не на ошибке в составе.
        run: |
          set -euo pipefail
          # обход каталога тоже под sudo: 750 root, glob под пользователем runner не раскроется
          sudo install -d -m 750 /etc/tbot/secrets
          for name in db_password db_url telegram_token telegram_socks_pass; do
            printf 'ci-placeholder-not-a-secret' | sudo tee "/etc/tbot/secrets/$name" >/dev/null
            sudo chmod 600 "/etc/tbot/secrets/$name"
          done
          sudo ls -l /etc/tbot/secrets
      - name: 'docker compose config: боевой overlay'
        run: |
          # Версия печатается намеренно: раннер даёт свой compose (на 2026-11-20 — v5.1.3),
          # а площадка — 2.40.3 из пакета Ubuntu. Разбор поэтому проверяет синтаксис и
          # правила слияния более новой реализации; расхождение фиксируется в
          # docs/acceptance/tls-edge.md §5 и снимается только прогоном на самой площадке.
          docker compose version
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config --quiet
      - name: 'разобранный состав: порты, digest, сети, лимиты'
        # Правила слияния overlay знает только compose, поэтому здесь проверяется результат
        # слияния, а не текст файла. Логика проверок — `scripts/prod_compose_check.py`,
        # она покрыта офлайн-тестами `tests/unit/test_prod_compose_check.py`.
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config --format json \
            | python3 scripts/prod_compose_check.py
      - name: 'Caddyfile валидируется тем же образом, что запустится на площадке'
        run: |
          set -euo pipefail
          caddy_digest=$(grep -m1 '^CADDY_DIGEST=' deploy/tbot.prod.env | cut -d= -f2)
          if [ -z "$caddy_digest" ]; then
            echo "в deploy/tbot.prod.env нет CADDY_DIGEST — проверять нечем" >&2
            exit 1
          fi
          # digest читают из файла, а не дублируют в workflow: копия указателя в двух местах
          # обязательно разъедется, и площадка получит не тот образ, что проверял CI.
          docker run --rm --network none --cap-drop ALL \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy "caddy@$caddy_digest" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: 'журнал разбора при неудаче'
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config || true

  deploy-check:
    name: проверка площадки (ожидания CI-раннера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: запуск проверки (база и туннель на раннере недоступны намеренно)
        run: python scripts/deploy_check.py --json | tee deploy-check.json
      - name: TLS брокера на раннере обязан падать без корня НУЦ (страховка от тихого отключения)
        run: |
          python - <<'PY'
          import json
          import sys

          report = json.load(open("deploy-check.json", encoding="utf-8"))
          checks = {item["name"]: item for item in report["checks"]}
          ca, broker = checks.get("ca_bundle", {}), checks.get("broker_tls", {})
          print("ca_bundle:", ca.get("ok"), str(ca.get("detail", ""))[:200])
          print("broker_tls:", broker.get("ok"), str(broker.get("detail", ""))[:200])
          problems = []
          if not ca.get("ok"):
              problems.append("ca_bundle: артефакт корня в репозитории не прошёл проверку")
          if broker.get("ok"):
              problems.append(
                  "broker_tls: на CI-раннере без корня НУЦ проверка не имеет права быть зелёной "
                  "— значит доверие отключили либо корень оказался заранее установлен"
              )
          if "цепочка не доверена" not in str(broker.get("detail", "")):
              problems.append(
                  "broker_tls: отказ обязан быть именно про доверие цепочки, а не про сеть: "
                  "в выводе нет «цепочка не доверена»"
              )
          if problems:
              print("; ".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print("OK: проверка включена, без корня НУЦ цепочка отклоняется")
          PY

  broker-tls:
    name: 'доверие TLS брокера: без корня — отказ, с корнем — успех (AC-broker-gateway-02)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: корень НУЦ из репозитория совпадает с закреплённым якорем
        # Отпечаток — единственный источник: scripts/ca_policy.py. Ни workflow, ни Dockerfile
        # не имеют права хранить свою копию отпечатка.
        run: python scripts/ca_policy.py
      - name: без установленного корня цепочка отклоняется, с ним — принимается
        # Детерминированная пара на своей ЦС: состояние сети раннёра и живость брокера на неё
        # не влияют. Иначе «упало из-за отсутствия сети» неотличимо от «упало из-за недоверия».
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout mock-key.pem -out mock-cert.pem \
            -days 2 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' 2>/dev/null
          cat > mock_server.py <<'PY'
          import http.server
          import ssl
          import sys

          port, cert, key = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(cert, key)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", port), http.server.SimpleHTTPRequestHandler)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          python mock_server.py 18443 mock-cert.pem mock-key.pem >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          python scripts/tls_trust_probe.py --host 127.0.0.1 --port 18443 --sni localhost \
            --expect unverified
          python scripts/tls_trust_probe.py --host 127.0.0.1 --port 18443 --sni localhost \
            --extra-ca mock-cert.pem --expect verified
      - name: живые точки брокера без корня — связь есть, доверия нет
        run: |
          set -euo pipefail
          for host in invest-public-api.tbank.ru sandbox-invest-public-api.tbank.ru; do
            python scripts/tls_trust_probe.py --host "$host" --expect unverified
          done
      - name: живые точки брокера с закреплённым корнём — цепочка проходит
        run: |
          set -euo pipefail
          for host in invest-public-api.tbank.ru sandbox-invest-public-api.tbank.ru; do
            python scripts/tls_trust_probe.py --host "$host" \
              --extra-ca deploy/ca/ru-trusted-root-ca.pem --expect verified
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-check
          path: deploy-check.json
