name: CI

# Конвейер повторяет набор команд TZ §4: те же шаги исполняются локально (`make ci-local`).
# Пороги и правила зафиксированы в pyproject.toml; их изменение — отдельное согласованное
# решение, которое видно в диффе (см. также `suppress-growth` ниже).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Порог подавления проверок (см. job quality / suppress-growth). Обновляется только вместе
  # с объяснением в описании PR. Текущий уровень = 14, инвентаризация — docs/acceptance/m0-quality.md:
  #   2 × `noqa: ARG003` — состав аргументов `settings_customise_sources` задаёт pydantic-settings,
  #       переименование сломает вызов библиотеки (аргументы передаются по именам);
  #   8 × `pragma: no cover` — процессная обвязка четырёх процессов (`run()` и `__main__`):
  #       сигналы, цикл heartbeat, запуск uvicorn. Она проверяется не юнит-тестом с подменой
  #       сигналов, а job'ом `compose-smoke` (реальный `docker compose up --wait` + опрос
  #       /healthz и /readyz). Логика внутри этих модулей (проверки готовности, охрана контуров,
  #       проба транспорта) покрыта тестами и в исключение не входит.
  #   4 × `nosec` в `scripts/{dev,deploy_check}.py` — bandit ругается на сам факт использования
  #       `subprocess` в dev/ops-скриптах: вызовы идут со `shell=False` и фиксированным списком
  #       аргументов; замечание B607 (частичный путь исполняемого файла) не подавлялось, а
  #       исправлено — путь берётся из `shutil.which`.
  SUPPRESSION_BASELINE: "14"

jobs:
  quality:
    name: lint + typecheck + guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: mypy --strict
        run: mypy .
      - name: bandit
        run: bandit -c pyproject.toml -r apps packages scripts
      - name: suppress-growth
        run: |
          count=$(python scripts/count_suppressions.py)
          echo "подавлений проверок: ${count} (базовый уровень ${SUPPRESSION_BASELINE})"
          if [ "${count}" -gt "${SUPPRESSION_BASELINE}" ]; then
            echo "рост числа подавлений недопустим без явного решения заказчика"
            python scripts/count_suppressions.py --list
            exit 1
          fi

  tests:
    name: тесты и покрытие
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: pytest (без live_api и e2e)
        run: python -m pytest -m "not live_api and not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  migrations:
    name: миграции (upgrade → downgrade → upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: tbot
          POSTGRES_USER: tbot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TBOT_DB_URL: postgresql://tbot:ci-only-password@localhost:5432/tbot
      TBOT_SECRETS_DIR: /tmp/tbot-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # `[dev]`, а не голое `-e .`: в этом job'е после цикла миграций исполняются тесты поведения
      # схемы и прав (pytest их не тянет как рантайм-зависимость).
      - run: pip install -e ".[dev]"
      - run: mkdir -p /tmp/tbot-secrets
      - name: upgrade head
        run: alembic upgrade head
      - name: downgrade base
        run: alembic downgrade base
      - name: upgrade head повторно
        run: alembic upgrade head
      - name: контрольная запись базовой ревизии
        run: |
          psql "postgresql://tbot:ci-only-password@localhost:5432/tbot" -Atc \
            "select value from app_meta where key='schema_baseline'" | grep -qx 0001
      # Порядок шагов job'а: этот идёт первым среди живых проверок базы. Защитный гейт скрипта
      # считает живых администраторов во всей таблице, поэтому предусловие «первой записи ещё
      # нет» детерминировано ровно в один момент — сразу после цикла миграций, где в `users` нет
      # ни строк, ни учётных записей: файлов, которые сеют администраторов, в job'е несколько, и
      # полагаться на их уборку было бы хрупко. Уборка самого файла (по префиксу логина, вместе с
      # сеансами и ссылками одобрения) оставляет таблицу пустой для шагов, которые идут дальше.
      # Завод первой учётной записи поверх живой схемы (TZ §1.2 «первая учётная запись», §4.1,
      # `ADR-020` п. 5, срез `T-112`, `ADR-023`): self-reference в `approved_by` выполняет
      # настоящий `fk_users_approved_by_users` — у `users.id` python-`default`, применяемый при
      # `flush`, поэтому «одобривший» мог бы остаться пустым, а пустое значение ограничение
      # принимает молча (ловим значением, не исключением); та же строка, став одобрившей для
      # другой учётки, не удаляется — `RESTRICT` держит след bootstrap'а (§4.1 «удаление — только
      # архивированием»). Защитный гейт считает состояния база: `archived` заводу не мешает,
      # `awaiting_approval` — мешает, потому что разница живёт в предикате `count(*)`, а не в `if`
      # над прочитанным значением. Повтор имени логина в другом регистре снимает `uq_users_login`
      # на `citext`, занятая почва (её uniqueness схема не держит, §4.1) снимает скрипт — оба
      # отказа печатают одно и то же и откатывают транзакцию: в таблице не появляется строка с
      # «доступом без одобрившего» (§8.8). Показанное значение проверяется `verify_password` на
      # хэше из колонки: иначе «показали одно, записали другое» всплыло бы на первом входе.
      # Адрес базы читается из конфигурации процесса и не появляется ни в аргументах, ни в выводе
      # (`ADR-004`, `packages/common/db.py`). Оффлайновая половинка —
      # `tests/integration/test_first_account.py` (ход скрипта на подставном соединении: там нет
      # ни `citext`, ни FK, ни отката транзакции, ни Argon2id в колонке).
      - name: завод первой учётной записи на живой базе (TZ §1.2, §4.1, ADR-020 п. 5, ADR-023, T-112)
        run: python -m pytest tests/integration/test_first_account_db.py -q -rs
      # Поведение и точное соответствие схемы на живой базе: колонки/типы/имена ограничений из
      # каталога, citext, CHECK-ограничения, частичный уникальный индекс, ON DELETE RESTRICT
      # (TZ §4.1, §8.1–8.3). Оффлайн-половинка — `tests/contract/test_identity_schema.py`.
      # `alembic check` здесь не используется: сравнение `server_default` у Alembic на PostgreSQL
      # эвристическое и даёт фантомные различия на приводимых типах (`'invited'::text`); как
      # инструмент `make revision` он остался, как приёмка схемы — нет.
      - name: поведение схемы на живой базе (TZ §4.1, §8.1–8.3)
        run: python -m pytest tests/integration/test_identity_schema_db.py -q -rs
      # Права роли приложения поверх развёрнутой схемы: `deploy/postgres/roles.sql` применяется
      # прямо в тесте, потому что в CI роль приложения создаётся только для проверки.
      - name: append-only права роли приложения (AC-identity-04)
        run: python -m pytest tests/integration/test_postgres_roles.py -q -rs
      # Цепочка хэшей журнала поверх живой схемы (TZ §4.1 `REQ-identity-04`, §8.7, срез `R1` задачи
      # `T-109`, `ADR-025`): хэш, посчитанный приложением, обязан совпасть с пересчётом по
      # прочитанным колонкам — `jsonb` не сохраняет порядок ключей, `INET` читается объектом
      # `ipaddress`, а `id` выдаёт база уже после того, как хэш посчитан (поэтому его в материале
      # нет, а хронологию читки задаёт именно он). Развилку цепочки отклоняет частичный уникальный
      # индекс `ix_audit_log_hash_prev_linked` (ревизия `0007`) с кодом `23505` — и для роли
      # владельца схемы в том числе, в отличие от append-only прав, которые у владельца не
      # действуют. Ручная правка строки и её вырез ролью-владельцем дают `content_mismatch` и
      # `broken_link` — вторая половина `AC-identity-04` («изменённая вручную копия дампа → найден
      # разрыв»); первую половину держит шаг выше. Оффлайновая половинка —
      # `tests/unit/test_audit_chain.py` (векторы хэшей, каноничность, политики `details`,
      # сверка реестра событий с перечнем §8.7).
      - name: цепочка хэшей журнала на живой базе (TZ §4.1, §8.7, AC-identity-04, ADR-025, T-109)
        run: python -m pytest tests/integration/test_audit_chain_db.py -q -rs
      # Протокол добавления записи журнала (TZ §4.1 `REQ-identity-04`, §8.7, срез `R2` задачи
      # `T-109`, `ADR-025` п. 6): `SqlStore.append_audit` берёт `pg_advisory_xact_lock` по ключу
      # журнала **до** чтения хвоста, поэтому второй писатель ждёт и привязывается к уже новой
      # записи — здесь проверяется то, чего память показать не может: замок не отдаётся второму
      # писателю (`pg_try_advisory_xact_lock`) и снимается фиксацией, привязка второй записи к хэшу
      # первой, отказ повторного `hash_prev` по коду
      # состояния `23505` (а не по тексту сообщения — `psycopg.errors.UniqueViolation` кода в
      # тексте не дублирует, замер `CI 45165930936`), откат бизнес-изменения вместе с отказом
      # вставки (перечитывается другим соединением, замер `CI 45163930282`) и то, что прочее
      # нарушение (`23503`) не выдаётся за конфликт цепочки. Оффлайновая половинка —
      # `tests/integration/test_audit_events_web.py` (какие события порождает слой входа) и
      # `tests/unit/test_audit_chain.py` (каноничность и реестр).
      - name: протокол добавления записи журнала на живой базе (TZ §4.1, §8.7, ADR-025 п. 6, T-109 R2)
        run: python -m pytest tests/integration/test_audit_append_db.py -q -rs
      # Инструмент разбора цепочки поверх живой схемы (TZ §8.7, `AC-identity-04`, `ADR-025` п. 7,
      # срез `R3.1` задачи `T-109`): `make audit-verify` пересчитывает `hash` каждой строки по её
      # колонкам и сверяет `hash_prev` с хэшем предыдущей строки в порядке `id`. Здесь проверяется
      # ровно то, чего память не показывает: ручная правка и вырез строки ролью-владельцем схемы
      # находятся инструментом с кодом возврата `1` — вторая половина `AC-identity-04` («изменённая
      # вручную копия дампа должна быть найдена»), корректный журнал даёт `0`, прогон ничего не
      # дописывает в журнал, а читающая сессия, уже державшая ORM-объект строки, обязана увидеть
      # новое значение: чтение идёт колонками §4.1, а не через identity map (замер первого красного
      # прогона `CI 45163930282`). Развилку (`duplicate_parent`) на живой базе создать нельзя — её
      # держит частичный уникальный индекс ревизии `0007`, шаг выше; оффлайновая половинка —
      # `tests/integration/test_audit_verify.py` (коды возврата, границы выборки, `missing_prefix`
      # как норма для уборки §2.8, отсутствие адреса базы в выводе).
      - name: разбор цепочки хэшей журнала инструментом на живой базе (TZ §8.7, AC-identity-04, ADR-025 п. 7, T-109 R3.1)
        run: python -m pytest tests/integration/test_audit_verify_db.py -q -rs
      # Счётчик частоты запросов (TZ §8.3, docs/adr/ADR-007) и CHECK формата хэша значения куки
      # на живой базе: PK-дубликаты окна, закрытый перечень областей, окно только из пары 60/300
      # секунд (§8.3 — минутные лимиты, §8.2 — пятиминутное окно перебора; пару выбрал заказчик,
      # `docs/HANDOFF.md §4`, вопрос закрыт), серверные default'ы и доступ роли приложения без
      # правок файла прав. Оффлайн-половинка — `tests/contract/test_rate_limits_schema.py`.
      - name: счётчик частоты запросов на живой базе (TZ §8.3, ADR-007)
        run: python -m pytest tests/integration/test_rate_buckets_db.py -q -rs
      # Слой входа поверх живой схемы (TZ §8.3, срез R3a): сессия появляется в таблице и находится
      # по `token_hash` (поиска по значению куки нет), `CHECK token_hash_format` отклоняет запись
      # значения куки вместо хэша, адрес из правого элемента `X-Forwarded-For` ложится в `INET`
      # канонически (v4 и v6), продление idle и отзыв видны следующему обращению, `RESTRICT` не
      # даёт удалить учётку с сессиями. Офлайн-половинка — `tests/integration/
      # test_web_session_cookie.py` и `test_web_csrf.py` (они исполняются в job `тесты и покрытие`).
      - name: слой входа на живой базе (TZ §8.3, R3a)
        run: python -m pytest tests/integration/test_web_identity_db.py -q -rs
      # Механизм лимитов частоты и бан адреса поверх живой схемы (TZ §8.2, §8.3, срез R3d):
      # конкурентный инкремент счётчика (`INSERT … ON CONFLICT DO UPDATE … RETURNING`) не теряет
      # обращений, окна 60 и 300 секунд живут раздельно, читается самое свежее подходящее окно,
      # срок бана выводится из полей строки (ADR-009), а чистка снимает только окна старше суток
      # и не трогает соседние таблицы. Офлайн-половинка — `tests/integration/test_web_rate_limit.py`
      # (она знает только `MemoryStore`: конкурентности там нет, поэтому инкремент
      # «прочитали—прибавили—записали» прошёл бы в памяти так же зелёно, а на базе снял бы лимит).
      - name: механизм лимитов частоты и чистка окон на живой базе (TZ §8.2, §8.3, ADR-009, R3d)
        run: python -m pytest tests/integration/test_rate_limit_mechanism_db.py -q -rs
      # Список сеансов и отзыв по одной / всех поверх живой схемы (TZ §8.3 «квалифицированный
      # отзыв», §9.3 п. 4, срез R3e): ограничения `user_id`, `revoked_at IS NULL` и `expires_at >`
      # уходят в текст запроса, который приложение реально отправляет в базу (в памяти тот же код
      # фильтрует циклом в Python, и по поведению слоя эти два мира неразличимы), чужая строка при
      # этом остаётся нетронутой, отзыв и «отзыв всех» видны новому соединению, просроченная сессия
      # не помечается отозванной задним числом (`revoked_at` остаётся пустым — это читает разбор
      # инцидента `T-109`), а адрес на страницу печатается каноническим текстом колонки `INET`
      # (`ADR-009`). Оффлайн-половинка — `tests/integration/test_web_sessions_page.py`.
      # Рядом тот же файл проверяет смену пароля (TZ §8.1 «после смены все сессии, кроме текущей,
      # отзываются», §8.8 «смена пароля отзывает сессии», срез R3f): новый `password_hash` и
      # `revoked_at` зафиксированы в таблице и видны другому соединению, учётка ищётся по `users.id`
      # (имени учётной записи в форме нет), в тексте запросов и их связанных значениях нет ни
      # значения куки, ни нового пароля, новая строка сеанса живая с шагом `full` и адресом `INET`,
      # неудача подбора текущего пароля и блокировка фиксируются в строке учётки, а отказ политики
      # не пишет ничего. Оффлайн-половинка — `tests/integration/test_web_password_change.py`
      # (в памяти нет ни `UPDATE users`, ни фиксации транзакции, ни колонок `INET`).
      - name: список сеансов, отзыв и смена пароля на живой базе (TZ §8.1, §8.3, §8.8, R3e–R3f)
        run: python -m pytest tests/integration/test_web_sessions_db.py -q -rs
      # Шифрование секрета привязки TOTP поверх живой схемы (TZ §8.4, ADR-014, срез R4b): `bytea`
      # переносит конверт `TBE1` байт в байт (в шифртексте с шансом около одного к четырём встречается
      # `0x00` — теряй перенос байты, привязка ломалась бы выборочно и только на площадке), полный
      # диапазон байтов возвращается без изменений, в тексте запросов и их параметрах нет ни ключа
      # привязки, ни его base32-текста, ни KEK (журнал запросов и `pg_stat_statements` секретов не
      # содержат), открытое значение база принимает, а слой шифрования на нём отказывает — то есть
      # защита «в колонке только шифртекст» живёт в приложении и не зависит от того, правили строку
      # через ORM или прямым `UPDATE`. Оффлайн-половинка — `tests/unit/test_totp_secret_protection.py`
      # и `tests/unit/test_envelope_crypto.py` (шифрование, векторы, привязка AAD, валидатор модели).
      - name: шифртекст секрета привязки TOTP на живой базе (TZ §8.4, ADR-014, R4b)
        run: python -m pytest tests/integration/test_totp_secret_storage_db.py -q -rs
      # Привязка TOTP поверх живой схемы (TZ §8.2, §4.1, ADR-013 п. 4, срез `R4c`): одну действующую
      # привязку на учётку держит частичный уникальный индекс `ix_totp_enrollments_user_active`, и
      # слот занимает тоже подтверждённая строка — поэтому повторная первичная выдача отвечает `409`,
      # а не «тихо заменила секрет». Отзыв освобождает слот, но строка остаётся в таблице (§8.4),
      # из-за чего маршрут обязан отзывать любую незавершённую привязку перед новой выдачей.
      # Одноразовость кода — один `UPDATE` с условием: затронута одна строка на первом занятии шага
      # и ноль — на повторе того же шага или на шаге ниже, а значение видно второму соединению;
      # на отозванной и на неподтверждённой строке шаг не занимается (между чтением привязки
      # маршрутом и записью шага привязку могут отозвать). `last_used_step` — bigint: номер шага
      # доходит до значений выше 2^31 (2038 год), и в integer переполнение было бы молчаливым.
      # Граница окна неудачных кодов задаётся запросом, а не Python: лента не обнуляется успехом,
      # и читать её целиком на каждый отказ нельзя. Оффлайновая половинка —
      # `tests/integration/test_web_totp_page.py` (в памяти нет ни уникального индекса, ни `UPDATE`
      # с условием, ни числа затронутых строк).
      - name: привязка TOTP, одноразовость кода и окно неудач на живой базе (TZ §8.2, R4c)
        run: python -m pytest tests/integration/test_totp_enrollment_db.py -q -rs
      # Резервные коды поверх живой схемы (TZ §8.2, `ADR-016` п. 3, 5, 7, срез `R5b`): пачка
      # ложится в таблицу только хэшами и одним `INSERT`, момент `created_at` ставит база;
      # `CHECK ck_backup_codes_code_hash_sha256` и слой доступа не пускают хэш другой формы (то есть
      # «битая» строка, неотличимая от «кода нет», штатным путём недостижима), а
      # `uq_backup_codes_user_id_code_hash` держит «10 разных» между выпусками. Поиск значения идёт
      # по `user_id` + `code_hash` строго среди `used_at IS NULL` — израсходованный, чужой и
      # никогда не выпущенный код дают один и тот же отказ (§8.8), а предикат виден в SQL и попадает
      # в частичный индекс `ix_backup_codes_user_id_unused`. Расход — один `UPDATE` с условием,
      # момент `used_at` равен `now()` того же транзакта; две параллельные попытки расхода одного
      # кода на двух соединениях дают ровно один успех (`test_backup_code_single_use`).
      # Повторная генерация аннулирует только неиспользованные остатки: у израсходованной строки
      # `used_at` не меняется (на нём держится семидневный срок), строк не становится меньше, а
      # `DELETE` к таблице не обращается вовсе; проверен и порядок вызовов (аннулирование после
      # вставки задевает и новую пачку). Ни значение кода, ни его показная форма не появляются ни в
      # тексте запроса, ни в связанных значениях — при этом перехват обязан видеть хэши, иначе
      # проверка была бы пустой. Оффлайн-половинка — `MemoryStore` в
      # `tests/integration/web_support.py` (в памяти нет ни атомарности, ни SQL, ни `CHECK`).
      - name: резервные коды, одноразовость расхода и аннулирование остатков на живой базе
        run: python -m pytest tests/integration/test_backup_codes_db.py -q -rs
      # Приглашения и состояния учётных записей поверх живой схемы (TZ §1.2, §4.1, `ADR-020` п. 4
      # и 6, срез `R7b`): приём одной ссылки выигрывает один запрос — `claim_invitation` это один
      # `UPDATE` с предикатами `state` и `expires_at`, и второе соединение того же выпуска получает
      # `rowcount = 0` (в памяти тот же предикат повторяется циклом, и там гонка с двумя учётными
      # записями прошла бы зелёно). Срок проверяется тем же условием, а не чтением до заявки,
      # отзыв не переписывает состоявшийся приём, повторный отзыв не даёт второго успеха.
      # Держатся и ограничения схемы: `uq_invitations_token_hash` (два выпуска с одним значением
      # сделали бы приём неопределимым), `ck_invitations_state`, `ck_invitations_target_present`,
      # `ON DELETE RESTRICT` на `invitations.created_by` и `users.approved_by` — учётная запись,
      # выдававшая выпуски или одобрившая доступ, не исчезает молча (§4.1). Порядок `ORDER BY
      # created_at`, фильтр по состоянию и потолок `LIMIT` читаются в тексте запроса: иначе очередь
      # одобрения читала бы таблицу целиком и ожидающий мог в неё не попасть (§9.3 п. 4). Счётчик
      # живых администраторов — `count(*)` с предикатами роли и состояния: заблокированный и
      # архивный администраторы считаться не должны, иначе проверка последнего живого отказывает
      # зря или пропускает закрытие доступа последнему (`ADR-020` п. 6). Оффлайновые половинки —
      # `tests/integration/test_invitation_flow.py` и `tests/integration/test_web_admin_accounts.py`
      # (те же правила через HTTP на `MemoryStore`).
      - name: приглашения, приём ссылки и состояния учётных записей на живой базе (TZ §1.2, §4.1, ADR-020, R7b)
        run: python -m pytest tests/integration/test_invitations_db.py -q -rs

  secret-scan:
    name: поиск секретов (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  audit:
    name: зависимости (pip-audit) и статический аудит
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # Аудит ровно продакшн-зависимостей: отдельное окружение, в котором ставится только
      # пакет приложения (без dev-зависимостей), и список зависимостей без самого пакета —
      # иначе pip-audit ищет в PyPI наш `tbot (0.0.0)` и падает с `--strict`.
      - run: python -m venv .venv-audit
      - run: .venv-audit/bin/pip install -e .
      - name: список продакшн-зависимостей
        run: |
          .venv-audit/bin/pip freeze --exclude-editable > deps-audit.txt
          echo "аудит по списку ($(wc -l < deps-audit.txt) пакетов):"; cat deps-audit.txt
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r deps-audit.txt

  compose-smoke:
    name: 'dev-стенд: сборка, готовность, изоляция базы'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dev-секреты стенда (не боевые)
        # Пути секретов в compose.yaml разрешаются относительно deploy/compose.yaml,
        # поэтому каталог — deploy/secrets, а не корень репозитория.
        run: |
          mkdir -p deploy/secrets
          printf 'ci-stand-db-password' > deploy/secrets/db_password
          printf 'postgresql://tbot:ci-stand-db-password@postgres:5432/tbot' > deploy/secrets/db_url
          printf 'ci-stand-not-a-real-token' > deploy/secrets/tg_bot_token
          printf 'ci-stand-not-a-real-password' > deploy/secrets/tg_socks_password
      - name: dev-копия файла ключей KEK (создаёт её тот же инструмент, что на площадке)
        # Пустышка, как и остальные файлы job'а: проверяется путь, монтирование и чтение,
        # а не значение. Создать её обязан `deploy/vps/keys_setup.py`, а не `printf`: формат
        # JSON с версиями ключей принимает собственный парсер приложения (`ADR-014` п. 5), и
        # «просто файл» дал бы зелёный разбор состава с красным чтением ключей. Прогон без root и с
        # `--expect-owner any`: владелец `0:10001` нерoot-процессом не выставлен.
        # Дальше — группа, а не «права пошире». Инструмент ставит норму `0640`, и приложение
        # эту норму требует: `packages.common.crypto.kek_file_mode_error` отклоняет любые биты
        # шире `0640`, поэтому `chmod 644` (как сделано выше для строковых секретов) для файла
        # ключей дал бы отказ чтения уже внутри контейнера. Доступ процессу контейнера выдаётся
        # группой с gid 10001 — ровно тот же приём, что на площадке (`ADR-005`). Владелец
        # остаётся пользователем runner'а: иначе каталог dev-секретов перестает быть доступным
        # `docker compose config`, который на раннере запускается не от root.
        run: |
          set -euo pipefail
          python3 deploy/vps/keys_setup.py --path deploy/secrets/kek.json --expect-owner any
          sudo chgrp 10001 deploy/secrets/kek.json
          stat -c '%n %a %u:%g %s' deploy/secrets/kek.json
      - name: docker compose config
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml config --quiet
      - name: собрать образы
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml build
      - name: поднять стенд
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait --wait-timeout 180 \
            postgres web engine jobs
      - name: миграции на стенде
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            run --rm migrate
      - name: web готов
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T web python -m packages.common.health_probe --url http://127.0.0.1:8080/readyz
      - name: файл ключей читается изнутри контейнера web (TZ §8.4, ADR-014)
        # Проверка ровно того, ради чего KEK монтируется: путь из настроек указывает на точку
        # монтирования секрета, файл открылся процессом контейнера (uid/gid 10001), и связка
        # ключей разобрана. Наружу выходят только метаданные — версии ключей и активная версия;
        # значения не печатаются (§8.4 «красное правило» про `repr`, логи и исключения).
        # Без этого шага «секрет смонтирован» отличался бы от «секрет читается» — ровно тот
        # дефект, который на площадке дал `PermissionError: /run/secrets/db_url` (`ADR-005`).
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T web python - <<'KEKREAD'
          import sys

          from packages.common.config import load_settings
          from packages.common.crypto import describe_key_ring

          path = load_settings().kek_file
          if str(path) != "/run/secrets/kek_file":
              print(f"FAIL: путь файла ключей в контейнере: {path}", file=sys.stderr)
              raise SystemExit(1)
          print(describe_key_ring(path))
          KEKREAD
      - name: engine и jobs живы
        run: |
          # Приёмка T-005 требует «/readyz 200 у web и engine», поэтому у engine проверяются
          # обе ручки: liveness (процесс жив) и readiness (контур + конфигурация). Разница
          # осмысленна: /readyz у engine на M0 может быть 503 при неверном контуре, тогда как
          # /healthz остаётся 200.
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python -m packages.common.health_probe --url http://127.0.0.1:9101/readyz
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python -m packages.common.health_probe --liveness --url http://127.0.0.1:9101/healthz
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T jobs python -m packages.common.health_probe --liveness --url http://127.0.0.1:9103/healthz
      - name: корень НУЦ установлен в системный набор доверия образа
        run: |
          # Половинка AC-broker-gateway-02 «с установленным корнем соединение обязано состояться»,
          # проверенная в самом образе: файл кладёт deploy/Dockerfile, а связку пересобирает
          # update-ca-certificates внутри образа. Отпечаток передаётся из scripts/ca_policy.py —
          # единственного места, где он закреплён; путь внутри образа здесь не повторяется: файл
          # ищется среди якорей, которые образ реально показал.
          set -euo pipefail
          expected=$(python3 scripts/ca_policy.py --print-fingerprint)
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T engine python - "$expected" <<'PY'
          import base64, hashlib, pathlib, re, socket, ssl, sys

          wanted = sys.argv[1]
          anchors = pathlib.Path("/usr/local/share/ca-certificates")
          bundle = pathlib.Path("/etc/ssl/certs/ca-certificates.crt")
          hosts = ("invest-public-api.tbank.ru", "sandbox-invest-public-api.tbank.ru")

          def blocks(text: str) -> list[str]:
              return re.findall(
                  r"-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----", text, re.S
              )

          def fingerprints(path: pathlib.Path) -> dict[str, str]:
              result: dict[str, str] = {}
              for block in blocks(path.read_text(encoding="utf-8", errors="replace")):
                  result[hashlib.sha256(base64.b64decode("".join(block.split()))).hexdigest()] = str(path)
              return result

          copied: dict[str, str] = {}
          for item in sorted(p for p in anchors.rglob("*") if p.is_file()):
              copied.update(fingerprints(item))
          if wanted not in copied:
              raise SystemExit(
                  f"корень НУЦ не скопирован в {anchors}: найдено {sorted(set(copied.values()))}"
              )

          store = set(fingerprints(bundle))
          if wanted not in store:
              raise SystemExit(
                  f"{copied[wanted]} в образе есть, но в {bundle} его нет: Debian читает только "
                  f"*.crt верхнего уровня {anchors} — проверьте расширение и каталог"
              )

          for host in hosts:
              context = ssl.create_default_context()
              with socket.create_connection((host, 443), timeout=20) as sock, \
                      context.wrap_socket(sock, server_hostname=host) as tls:
                  print(f"OK {host}: цепочка доверена набору образа ({tls.version()})")
          print(f"OK: корень {wanted[:16]}… из {copied[wanted]} входит в {bundle} ({len(store)} якорей)")
          PY
      - name: у контейнера базы нет исходящего трафика
        # В образе postgres нет python3 (debian-slim + postgresql без recommends), поэтому
        # проба — на bash: /dev/tcp — встроенная возможность bash, а `timeout` — coreutils.
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml \
            exec -T postgres bash -s <<'SH'
          set -u
          if timeout 6 bash -c 'exec 3<>/dev/tcp/8.8.8.8/443' 2>/dev/null; then
            echo "FAIL: у базы появилось исходящее соединение" >&2
            exit 1
          fi
          echo "OK: исходящий трафик базы заблокирован (внутренняя сеть)"
          SH
      - name: журнал контейнеров при неудаче
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml logs --tail=200

  prod-config:
    name: 'боевой состав: compose-overlay, digest, Caddyfile'
    # Боевой состав нигде не поднимается (ни локально, ни в compose-smoke), поэтому хотя бы
    # разбирается здесь: `docker compose config` знает настоящие правила слияния overlay, а
    # `caddy validate` внутри образа с закреплённым digest проверяет Caddyfile, не трогая
    # площадку. Статическая половина контракта — tests/integration/test_compose_prod_contract.py.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 'файлы секретов площадки (пустышки: проверяется путь, а не значение)'
        # compose при разборе состава требует, чтобы файлы секретов существовали; имена ниже —
        # те же, что кладёт заказчик (TZ §14.3, docs/runbook/telegram-token.md). Без этого шага
        # разбор падал бы на отсутствующем файле, а не на ошибке в составе.
        run: |
          set -euo pipefail
          # обход каталога тоже под sudo: 750 root, glob под пользователем runner не раскроется
          sudo install -d -m 750 /etc/tbot/secrets
          for name in db_password db_url telegram_token telegram_socks_pass; do
            printf 'ci-placeholder-not-a-secret' | sudo tee "/etc/tbot/secrets/$name" >/dev/null
            sudo chmod 600 "/etc/tbot/secrets/$name"
          done
          sudo ls -l /etc/tbot/secrets

      - name: 'файл ключей KEK: инструмент, --check, сломанные права, --remed, проба DAC'
        # Файл обязан существовать до разбора состава: compose раннёра (v5.1.3) требует,
        # чтобы файловые секреты лежали на месте (compose площадки 2.40.3 — не требует,
        # docs/runbook/stand-deploy.md §3). Создаёт его штатный инструмент и по штатному пути,
        # поэтому шаг заодно проверяет, что путь инструмента и путь `compose.prod.yaml` не
        # разъехались. Значение фиктивное: его генерирует сам инструмент (режим (2) `ADR-004`),
        # боевых ключей в CI нет и в журнал они не попадают — наружу только метаданные.
        run: |
          set -euo pipefail
          kek=/etc/tbot/keys/kek.json
          sudo python3 deploy/vps/keys_setup.py
          sudo python3 deploy/vps/keys_setup.py --check
          # Перезапись существующего файла без разрешения запрещена: потеря значения делает
          # нечитаемыми уже зашифрованные привязки (`ADR-014`). В неинтерактивном прогоне
          # подтвердиться нечем, поэтому ожидание — отказ и целой файл (заодно проверяется
          # ветка «stdin не терминал», которая на Windows ещё и `isatty()` врёт).
          before=$(sudo sha256sum "$kek")
          if sudo python3 deploy/vps/keys_setup.py </dev/null; then
            echo "FAIL: инструмент перезаписал существующий файл ключей без --force" >&2
            exit 1
          fi
          if [ "$before" != "$(sudo sha256sum "$kek")" ]; then
            echo "FAIL: отказ перезаписать файл ключей не оставил файл нетронутым" >&2
            exit 1
          fi
          # Негативная проба: `--check` обязан падать на режиме, при котором процесс контейнера
          # файл не читает. Зелёная диагностика при 600 root:root — это ровно тот дефект,
          # который на площадке выглядел как `migrate_exit=1` с PermissionError (`ADR-005`).
          sudo chmod 600 "$kek"
          if sudo python3 deploy/vps/keys_setup.py --check; then
            echo "FAIL: --check не заметил режим 600 у монтируемого файла ключей" >&2
            exit 1
          fi
          # `--remed` приводит владельца и режим, не касаясь значений (перезаливать KEK нельзя:
          # привязки, зашифрованные прежним значением, после перезаписи не читаются — это `T-107`).
          sudo python3 deploy/vps/keys_setup.py --remed

          # Проба DAC из `ADR-005`: процесс в контейнере работает под uid/gid 10001
          # (`deploy/Dockerfile: USER 10001:10001`), а bind-маунт приносит хозяйские права.
          # Значит `640 root:gid 10001` обязан читаться этим процессом, а `600 root:root` — нет.
          # До этого среза половина `ADR-005` про «нужен gid контейнера» проверялась только
          # руками на живой ВМ (замеры `test -r`), здесь она исполняется в CI.
          # Каталог файла ключей на площадке закрыт (`0700 root:root`), и составу это не мешает:
          # bind-маунт файла делает демон от root, а процесс внутри контейнера видит точку
          # монтирования, а не хозяйский путь. Поэтому проба снимка делается в каталоге с битом
          # входа (`0711`: вход есть, перечисления нет) — иначе проверялся бы отказ каталога,
          # а не биты файла.
          dac=$(sudo mktemp -d /tmp/tbot-kek-dac-XXXXXX)
          sudo python3 deploy/vps/keys_setup.py --path "$dac/kek.json"
          sudo chmod 711 "$dac"
          # Содержимое наружу не печатается: только длина прочитанных байтов.
          sudo setpriv --reuid=10001 --regid=10001 --clear-groups \
            python3 -c 'import pathlib,sys; print("DAC_READ_BYTES", len(pathlib.Path(sys.argv[1]).read_bytes()))' "$dac/kek.json"
          sudo chmod 600 "$dac/kek.json"
          if sudo setpriv --reuid=10001 --regid=10001 --clear-groups \
               python3 -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).read_bytes()' "$dac/kek.json"; then
            echo "FAIL: uid/gid 10001 прочитал файл ключей с правами 600 root:root" >&2
            exit 1
          fi
          sudo rm -rf "$dac"
          # Итог: норма площадки восстановлена `--remed`, файл на месте и разборный.
          sudo python3 deploy/vps/keys_setup.py --check

      - name: 'скрипт ввода секретов: форма значений, режимы, вердикты --check'
        # Повод — замер 2026-11-20 на площадке: `--check` дал зелёный вывод при значениях не по
        # назначению (в db_url попали 11 цифр вместо DSN, в ghcr_token — 11 символов не-PAT, в
        # db_password — фраза с пробелами, а telegram_token не создан вовсе). Значения ниже
        # фиктивные: боевые секреты в CI не появляются и не попадают в журнал/кэш. Проверяется
        # механизм: отказ по форме до записи, генерация пароля базы, сборка db_url из пароля,
        # побайтовая длина (лишний перевод строки ломает DSN и токен), порядок «значение → свой
        # файл», вердикты `--check` и падение проверки на испорченном режиме.
        run: |
          set -euo pipefail
          sudo bash -s <<'EOS'
          set -euo pipefail
          script=deploy/vps/secrets-setup.sh
          tmp=$(mktemp -d /tmp/tbot-secrets-XXXXXX)
          trap 'rm -rf "$tmp"' EXIT

          # (a) форма важнее наличия: три попытки + отказ от записи => ни одного файла.
          TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --force >"$tmp/reject" 2>&1 <<'FIXTURE_BAD'
          not a valid password with spaces
          not a valid password with spaces
          not a valid password with spaces
          n
          79135791350
          79135791350
          79135791350
          n
          79135791350
          79135791350
          79135791350
          n
          FIXTURE_BAD
          grep -q 'НЕ ПОДХОДИТ: ghcr_token' "$tmp/reject"
          grep -q 'db_url: собранный DSN не по форме' "$tmp/reject"
          for name in db_password db_url ghcr_token telegram_token; do
            if [ -e "$tmp/$name" ]; then
              echo "FAIL: значение не по форме записано в $name" >&2
              exit 1
            fi
          done

          # (b) штатный прогон: пустая строка для db_password = генерация, db_url скрипт собирает
          # сам из сгенерированного пароля. Ответы генерируются на месте и склеиваются из частей:
          # строка вида «цифры:35 символов» в файле workflow выглядела бы как настоящий токен бота,
          # а contract-тест test_no_forbidden_references такие строки в CI запрещает.
          python3 - <<'PYFIX_OK' | TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --force >"$tmp/write" 2>&1
          import sys
          prefix, ident = "ghp_", "A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8"
          bot_id, bot_tail = "123456789", "AAHabcdefghij_klmnopqrstuvwxy012345"
          assert len(ident) == 36 and len(bot_tail) == 35
          sys.stdout.write("\n" + prefix + ident + "\n" + bot_id + chr(58) + bot_tail + "\n")
          PYFIX_OK
          grep -q 'сгенерирован автоматически' "$tmp/write"
          grep -q 'записано файлов: 4' "$tmp/write"
          test "$(stat -c %s "$tmp/ghcr_token")" -eq 40
          test "$(stat -c %s "$tmp/telegram_token")" -eq 45
          test "$(stat -c %a "$tmp/ghcr_token")" -eq 600
          test "$(stat -c %u:%g "$tmp/ghcr_token")" = 0:0
          # ADR-005: файл, который compose монтирует в контейнер, читает процесс под uid/gid
          # 10001 (deploy/Dockerfile: USER 10001:10001), а bind-маунт приносит хозяйские права с
          # хоста. Поэтому монтируемые файлы — 640 и gid контейнера; 600 root:root даёт
          # PermissionError уже на migrate (замер на площадке 2026-11-20).
          test "$(stat -c %a "$tmp/db_url")" -eq 640
          test "$(stat -c %u:%g "$tmp/db_url")" = 0:10001

          # (c) db_url обязан быть собран из того же пароля, что лежит в db_password: рассинхон
          # этой пары и есть причина падения migrate на площадке. Значения не печатаются — только
          # вердикты и длины.
          python3 - "$tmp" <<'PYEOF'
          import pathlib, sys
          d = pathlib.Path(sys.argv[1])
          pw = (d / "db_password").read_bytes().decode()
          url = (d / "db_url").read_bytes().decode()
          shape = url.startswith("postgresql+psycopg://tbot:") and url.endswith("@postgres:5432/tbot")
          print("DSN_SHAPE", shape, "DSN_MATCH", pw in url, "PW_LEN", len(pw), "URL_LEN", len(url))
          ok = shape and (pw in url) and (len(url) == len(pw) + 45) and (len(pw) == 48)
          raise SystemExit(0 if ok else 1)
          PYEOF

          # (d) --check: четыре файла состава OK; файл туннеля виден отдельной строкой (его
          # создаёт T-714, не этот скрипт); каталог 700. Итог ненулевой именно из-за файла туннеля.
          TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --check >"$tmp/chk" 2>&1 || true
          test "$(grep -c '^OK:' "$tmp/chk")" -eq 4
          grep -q 'FAIL: нет файла:.*telegram_socks_pass' "$tmp/chk"
          test "$(stat -c %a "$tmp")" -eq 700

          # (e) негативная проба: --check обязан падать на испорченном режиме, иначе проверка прав
          # — украшение.
          chmod 644 "$tmp/ghcr_token"
          if TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --check >"$tmp/chk2" 2>&1; then
            echo "FAIL: --check не заметил режим 644" >&2
            exit 1
          fi
          grep -q 'ghcr_token: 40 байт, 644' "$tmp/chk2"
          # (е) ADR-005: 600 у монтируемого секрета — тоже ошибка прав: процесс в образе работает
          # под uid/gid 10001, bind-маунт сохраняет хозяйские права. На площадке это выглядело как
          # migrate_exit=1 с PermissionError: '/run/secrets/db_url'.
          chmod 600 "$tmp/db_url"
          if TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --check >"$tmp/chk3" 2>&1; then
            echo "FAIL: --check не заметил режим 600 у монтируемого секрета db_url" >&2
            exit 1
          fi
          grep -q 'db_url: [^\n]*600[^\n]*нужно 640' "$tmp/chk3"

          # (ё) --remed: права приводятся без касания значений. На площадке пароль базы уже осел в
          # томе pgdata при initdb, а внешние токены нельзя переливать повторно (ADR-004: такое
          # значение считается скомпрометированным). Поэтому сверяются контрольные суммы.
          before=$(cd "$tmp" && md5sum db_password db_url ghcr_token telegram_token | md5sum)
          TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --remed >"$tmp/rem" 2>&1
          grep -q 'приведено файлов: 2' "$tmp/rem"
          after=$(cd "$tmp" && md5sum db_password db_url ghcr_token telegram_token | md5sum)
          if [ "$before" != "$after" ]; then
            echo "FAIL: --remed изменил содержимое файлов — права приводятся без перезаписи" >&2
            exit 1
          fi
          TBOT_SECRETS_SETUP_DIR="$tmp" bash "$script" --check >"$tmp/chk4" 2>&1 || true
          test "$(grep -c '^OK:' "$tmp/chk4")" -eq 4

          EOS

      - name: 'docker compose config: боевой overlay'
        run: |
          # Версия печатается намеренно: раннер даёт свой compose (на 2026-11-20 — v5.1.3),
          # а площадка — 2.40.3 из пакета Ubuntu. Разбор поэтому проверяет синтаксис и
          # правила слияния более новой реализации; расхождение фиксируется в
          # docs/acceptance/tls-edge.md §5 и снимается только прогоном на самой площадке.
          docker compose version
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config --quiet
      - name: 'разобранный состав: порты, digest, сети, лимиты'
        # Правила слияния overlay знает только compose, поэтому здесь проверяется результат
        # слияния, а не текст файла. Логика проверок — `scripts/prod_compose_check.py`,
        # она покрыта офлайн-тестами `tests/unit/test_prod_compose_check.py`.
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config --format json \
            | python3 scripts/prod_compose_check.py
      - name: 'Caddyfile валидируется тем же образом, что запустится на площадке'
        run: |
          set -euo pipefail
          caddy_digest=$(grep -m1 '^CADDY_DIGEST=' deploy/tbot.prod.env | cut -d= -f2)
          if [ -z "$caddy_digest" ]; then
            echo "в deploy/tbot.prod.env нет CADDY_DIGEST — проверять нечем" >&2
            exit 1
          fi
          # digest читают из файла, а не дублируют в workflow: копия указателя в двух местах
          # обязательно разъедется, и площадка получит не тот образ, что проверял CI.
          docker run --rm --network none --cap-drop ALL \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy "caddy@$caddy_digest" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: 'журнал разбора при неудаче'
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            --env-file deploy/tbot.prod.env config || true

  deploy-check:
    name: проверка площадки (ожидания CI-раннера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: запуск проверки (база и туннель на раннере недоступны намеренно)
        run: python scripts/deploy_check.py --json | tee deploy-check.json
      - name: TLS брокера на раннере обязан падать без корня НУЦ (страховка от тихого отключения)
        run: |
          python - <<'PY'
          import json
          import sys

          report = json.load(open("deploy-check.json", encoding="utf-8"))
          checks = {item["name"]: item for item in report["checks"]}
          ca, broker = checks.get("ca_bundle", {}), checks.get("broker_tls", {})
          print("ca_bundle:", ca.get("ok"), str(ca.get("detail", ""))[:200])
          print("broker_tls:", broker.get("ok"), str(broker.get("detail", ""))[:200])
          problems = []
          if not ca.get("ok"):
              problems.append("ca_bundle: артефакт корня в репозитории не прошёл проверку")
          if broker.get("ok"):
              problems.append(
                  "broker_tls: на CI-раннере без корня НУЦ проверка не имеет права быть зелёной "
                  "— значит доверие отключили либо корень оказался заранее установлен"
              )
          if "цепочка не доверена" not in str(broker.get("detail", "")):
              problems.append(
                  "broker_tls: отказ обязан быть именно про доверие цепочки, а не про сеть: "
                  "в выводе нет «цепочка не доверена»"
              )
          if problems:
              print("; ".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print("OK: проверка включена, без корня НУЦ цепочка отклоняется")
          PY

  broker-tls:
    name: 'доверие TLS брокера: без корня — отказ, с корнем — успех (AC-broker-gateway-02)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: корень НУЦ из репозитория совпадает с закреплённым якорем
        # Отпечаток — единственный источник: scripts/ca_policy.py. Ни workflow, ни Dockerfile
        # не имеют права хранить свою копию отпечатка.
        run: python scripts/ca_policy.py
      - name: без установленного корня цепочка отклоняется, с ним — принимается
        # Детерминированная пара на своей ЦС: состояние сети раннёра и живость брокера на неё
        # не влияют. Иначе «упало из-за отсутствия сети» неотличимо от «упало из-за недоверия».
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout mock-key.pem -out mock-cert.pem \
            -days 2 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' 2>/dev/null
          cat > mock_server.py <<'PY'
          import http.server
          import ssl
          import sys

          port, cert, key = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(cert, key)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", port), http.server.SimpleHTTPRequestHandler)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          python mock_server.py 18443 mock-cert.pem mock-key.pem >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          python scripts/tls_trust_probe.py --host 127.0.0.1 --port 18443 --sni localhost \
            --expect unverified
          python scripts/tls_trust_probe.py --host 127.0.0.1 --port 18443 --sni localhost \
            --extra-ca mock-cert.pem --expect verified
      - name: живые точки брокера без корня — связь есть, доверия нет
        run: |
          set -euo pipefail
          for host in invest-public-api.tbank.ru sandbox-invest-public-api.tbank.ru; do
            python scripts/tls_trust_probe.py --host "$host" --expect unverified
          done
      - name: живые точки брокера с закреплённым корнём — цепочка проходит
        run: |
          set -euo pipefail
          for host in invest-public-api.tbank.ru sandbox-invest-public-api.tbank.ru; do
            python scripts/tls_trust_probe.py --host "$host" \
              --extra-ca deploy/ca/ru-trusted-root-ca.pem --expect verified
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-check
          path: deploy-check.json
